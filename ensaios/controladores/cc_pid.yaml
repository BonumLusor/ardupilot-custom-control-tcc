# Backend PID de exemplo do AC_CustomControl — o caminho por onde o controlador
# proprio vai entrar. Os ganhos vivem sob o prefixo CC2_, do
# AP_SUBGROUPVARPTR(_backend, "2_", ...) em AC_CustomControl.cpp.
nome: "AC_CustomControl — PID de exemplo"
slug: cc_pid
descricao: >
  Mesma estrutura PID do nativo, porem executada dentro do AC_CustomControl.
  Serve para validar o caminho de integracao antes de trocar a lei de controle:
  com os mesmos ganhos, deve reproduzir o nativo.

params:
  CC_TYPE: 2
  CC_AXIS_MASK: 7      # rolagem + arfagem + guinada
  RC6_OPTION: 109      # CUSTOM_CONTROLLER — sem isto o backend nunca assume

reboot_apos_params: true

# O AC_CustomControl so entra em operacao com a chave auxiliar em HIGH
# (RC_Channel_Copter.cpp:671). CC_TYPE=2 sozinho apenas instancia o backend: o
# voo sairia com o PID nativo e os parametros diriam o contrario. O run_ensaio.py
# forca o canal e o campo espera_cc_tipo, abaixo, confere no log se pegou.
rc_override:
  6: 2000

# Os ganhos do AutoTune do nativo (controladores/nativo.yaml), com o prefixo do
# backend: com eles o cc_pid tem de reproduzir o nativo. O ATC_ACC_*_MAX fica
# ATC_ porque o alvo continua sendo modelado pelo AC_AttitudeControl nativo.
# Ficam de fora, nos 90% dos compilados, os filtros FLTT/FLTD (18 Hz, contra
# 20 no nativo) e o IMAX (0.45, contra 0.5), que o AutoTune nao mexe.
ganhos:
  CC2_RAT_RLL_P: 0.08616
  CC2_RAT_RLL_I: 0.08616
  CC2_RAT_RLL_D: 0.000375
  CC2_RAT_PIT_P: 0.08616
  CC2_RAT_PIT_I: 0.08616
  CC2_RAT_PIT_D: 0.000375
  CC2_RAT_YAW_P: 0.607519
  CC2_RAT_YAW_I: 0.060752
  CC2_RAT_YAW_D: 0.0
  CC2_RAT_YAW_FLTE: 1.0
  CC2_ANG_RLL_P: 26.714348
  CC2_ANG_PIT_P: 25.442236
  CC2_ANG_YAW_P: 2.294865
  ATC_ACC_R_MAX: 5856.644531
  ATC_ACC_P_MAX: 5703.29248
  ATC_ACC_Y_MAX: 115.243027

ganhos_de_interesse:
  - CC2_RAT_RLL_P
  - CC2_RAT_RLL_I
  - CC2_RAT_RLL_D
  - CC2_ANG_RLL_P

msg_pid: PIDR

espera_cc_tipo: 2
