# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: PID nativo com os ganhos do LQI
slug: nativo_lqi
descricao: 'Prova de equivalencia: a cascata P de angulo + PI de taxa do nativo com os ganhos
  que reproduzem o LQI (filtros FLTT/FLTE e D desligados). So ha cascata equivalente quando
  k_th^2 >= 4 k_w k_i; nos eixos em que nao ha, ficam os ganhos do AutoTune.'
params:
  CC_TYPE: 0
reboot_apos_params: true
ganhos:
  ATC_RAT_RLL_P: 0.0931107
  ATC_RAT_RLL_I: 0.598975
  ATC_RAT_RLL_D: 0.0
  ATC_RAT_PIT_P: 0.092306
  ATC_RAT_PIT_I: 0.35756
  ATC_RAT_PIT_D: 0.0
  ATC_RAT_YAW_P: 0.607519
  ATC_RAT_YAW_I: 0.060752
  ATC_RAT_YAW_D: 0.0
  ATC_RAT_YAW_FLTE: 1.0
  ATC_ANG_RLL_P: 11.9023
  ATC_ANG_PIT_P: 13.7348
  ATC_ANG_YAW_P: 2.294865
  ATC_ACC_R_MAX: 5856.644531
  ATC_ACC_P_MAX: 5703.29248
  ATC_ACC_Y_MAX: 115.243027
  ATC_RAT_RLL_FLTT: 0.0
  ATC_RAT_RLL_FLTE: 0.0
  ATC_RAT_PIT_FLTT: 0.0
  ATC_RAT_PIT_FLTE: 0.0
ganhos_de_interesse:
- ATC_RAT_RLL_P
- ATC_RAT_RLL_I
- ATC_ANG_RLL_P
msg_pid: PIDR
espera_cc_tipo: 0

# So os cenarios do lote original (run_ensaio.voa_no_cenario): este
# controlador e uma verificacao feita para eles.
cenarios:
- rolagem/nominal
- rolagem/torque_pulso
- rolagem/torque_degrau
- rolagem/torque_chirp
- arfagem/nominal
- arfagem/torque_pulso
- arfagem/torque_degrau
- arfagem/torque_chirp
- guinada/nominal
- guinada/torque_pulso
- guinada/torque_degrau
- guinada/torque_chirp
- rolagem_arfagem_guinada/nominal
- rolagem_arfagem_guinada/torque_pulso
- rolagem_arfagem_guinada/torque_degrau
- ruido/rnd20/torque_pulso
- ruido/rnd20/torque_degrau
- vento/rajada
