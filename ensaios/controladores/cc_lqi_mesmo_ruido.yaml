# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: AC_CustomControl — LQI, guinada com o ruido do nativo
slug: cc_lqi_mesmo_ruido
descricao: O LQI de cc_lqi.yaml em rolagem e arfagem; na guinada, sintonizado para o mesmo
  ganho de ruido do giroscopio no esforco que o nativo (que filtra o erro de taxa de guinada
  a 1 Hz), no lugar da mesma frequencia de cruzamento. Banda menor e desvio maior na guinada,
  em troca de sensibilidade a ruido igual a do nativo.
params:
  CC_TYPE: 3
  CC_AXIS_MASK: 7
  RC6_OPTION: 109
reboot_apos_params: true

# O backend so assume com a chave auxiliar em HIGH (RC6_OPTION 109);
# o run_ensaio.py forca o canal, e espera_cc_tipo confere no log.
rc_override:
  6: 2000

# Os CC3_* so existem com o backend instanciado (CC_TYPE 3 + reboot): o
# run_ensaio.py os aplica depois do reboot. O ATC_ACC_*_MAX e o do nativo.
ganhos:
  CC3_MODO: 0
  CC3_FF: 1
  CC3_A: 1.98813
  CC3_FLTW: 20.0
  CC3_B_X: 430.023
  CC3_KI_X: 7.12921
  CC3_KTH_X: 1.70721
  CC3_KW_X: 0.0931107
  CC3_B_Y: 430.023
  CC3_KI_Y: 4.911
  CC3_KTH_Y: 1.62536
  CC3_KW_Y: 0.092306
  CC3_B_Z: 14.3669
  CC3_KI_Z: 0.333419
  CC3_KTH_Z: 0.531227
  CC3_KW_Z: 0.170104
  ATC_ACC_R_MAX: 5856.644531
  ATC_ACC_P_MAX: 5703.29248
  ATC_ACC_Y_MAX: 115.243027
ganhos_de_interesse:
- CC3_KI_Z
- CC3_KTH_Z
- CC3_KW_Z
msg_pid: PIDR
espera_cc_tipo: 3
