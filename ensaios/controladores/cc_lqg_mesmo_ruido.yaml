# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: AC_CustomControl — LQG, ganho de ruido do nativo
slug: cc_lqg_mesmo_ruido
descricao: 'O LQG de cc_lqg.yaml projetado para o ganho real sobre o nativo (o portao do plano):
  ruido no esforco nao maior que o do nativo, margem de fase e margem com a planta alterada
  nao menores, nada pior que o nativo nas metricas de torque, e a menor metrica primaria (pico
  do pulso em rolagem e arfagem, pico do degrau de torque em guinada). Difere do cc_lqg nos
  tres eixos.'
params:
  CC_TYPE: 4
  CC_AXIS_MASK: 7
  RC6_OPTION: 109
reboot_apos_params: true

# O backend so assume com a chave auxiliar em HIGH (RC6_OPTION 109);
# o run_ensaio.py forca o canal, e espera_cc_tipo confere no log.
rc_override:
  6: 2000

# Os CC4_* so existem com o backend instanciado (CC_TYPE 4 + reboot): o
# run_ensaio.py os aplica depois do reboot. O ATC_ACC_*_MAX e o do nativo.
