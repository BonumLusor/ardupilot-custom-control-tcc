# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: AC_CustomControl — LQR + ESO
slug: cc_eso
descricao: Realimentacao de [theta, w] (LQR discreto), sem integrador, com a perturbacao estimada
  por um observador de estado estendido de [w, d] e cancelada (-d_hat/b), no backend AC_CustomControl_LQR
  com CC3_MODO = 1. A banda do observador e a que da a recuperacao mais rapida mantendo a
  margem de fase do nativo.
params:
  CC_TYPE: 3
  CC_AXIS_MASK: 7
  RC6_OPTION: 109
reboot_apos_params: true

# O backend so assume com a chave auxiliar em HIGH (RC6_OPTION 109);
# o run_ensaio.py forca o canal, e espera_cc_tipo confere no log.
rc_override:
  6: 2000

# Os CC3_* so existem com o backend instanciado (CC_TYPE 3 + reboot): o
# run_ensaio.py os aplica depois do reboot. O ATC_ACC_*_MAX e o do nativo.
ganhos:
  CC3_MODO: 1
  CC3_FF: 1
  CC3_A: 1.98813
  CC3_FLTW: 20.0
  CC3_B_X: 430.023
  CC3_KTH_X: 1.55519
  CC3_KW_X: 0.0951629
  CC3_ESO_L1_X: 0.0399696
  CC3_ESO_L2_X: 0.202351
  CC3_B_Y: 430.023
  CC3_KTH_Y: 1.52428
  CC3_KW_Y: 0.0939033
  CC3_ESO_L1_Y: 0.0339646
  CC3_ESO_L2_Y: 0.151874
  CC3_B_Z: 14.3669
  CC3_KTH_Z: 1.13786
  CC3_KW_Z: 0.323877
  CC3_ESO_L1_Z: 0.0169285
  CC3_ESO_L2_Z: 0.0480209
  ATC_ACC_R_MAX: 5856.644531
  ATC_ACC_P_MAX: 5703.29248
  ATC_ACC_Y_MAX: 115.243027
ganhos_de_interesse:
- CC3_KTH_X
- CC3_KW_X
- CC3_ESO_L1_X
- CC3_ESO_L2_X
msg_pid: PIDR
espera_cc_tipo: 3
