# Linha de base quantitativa: o PID nativo do ArduPilot, sem AC_CustomControl.
nome: "PID nativo, guinada ressintonizada"
slug: nativo_guinada
descricao: >
  O nativo com os ganhos de guinada do melhor PID em cascata de ganhos livres do
  portao (modelagem/projeto.py, Tabela 13), sob as mesmas restricoes de ruido e de
  margem; rolagem e arfagem ficam com os do AutoTune. Ponto da varredura: {'kp': 0.6324555320336759, 'ki_kp': 3.0, 'ang_p': 0.5, 'flte': 2.0}.
  E a linha de base de guinada sem a razao k_I = k_P/10 do AutoTune (revisao de
  3/11, item 2.3). Gerado por monografia/verificacao/scripts/nativo_guinada.py.

params:
  CC_TYPE: 0

reboot_apos_params: true

# Ganhos do AutoTune do ArduPilot (autotune.py, AUTOTUNE_AXES 7, AGGR 0.075),
# rodado no mesmo SITL dos ensaios: resultados/autotune/2026-10-15_214741/. Sem
# eles, o nativo voaria com os do frame (copter.parm), que nao foram sintonizados
# para este veiculo. O AutoTune grava tambem o ATC_ACC_*_MAX, que limita o alvo
# modelado — por isso ele vem junto, e o cc_pid repete o mesmo valor.
#  Na guinada o AutoTune fixa I = P/10 (AUTOTUNE_YAW_PI_RATIO_FINAL): a
# recuperacao de um torque sustentado continua com tau ~ P/I = 10 s.
ganhos:
  ATC_RAT_RLL_P: 0.08616
  ATC_RAT_RLL_I: 0.08616
  ATC_RAT_RLL_D: 0.000375
  ATC_RAT_PIT_P: 0.08616
  ATC_RAT_PIT_I: 0.08616
  ATC_RAT_PIT_D: 0.000375
  ATC_RAT_YAW_P: 0.384229
  ATC_RAT_YAW_I: 1.15269
  ATC_RAT_YAW_D: 0.0
  ATC_RAT_YAW_FLTE: 2
  ATC_ANG_RLL_P: 26.714348
  ATC_ANG_PIT_P: 25.442236
  ATC_ANG_YAW_P: 1.14743
  ATC_ACC_R_MAX: 5856.644531
  ATC_ACC_P_MAX: 5703.29248
  ATC_ACC_Y_MAX: 115.243027

ganhos_de_interesse:
  - ATC_RAT_YAW_P
  - ATC_RAT_YAW_I
  - ATC_ANG_YAW_P
  - ATC_RAT_YAW_FLTE
  - ATC_RAT_RLL_P
  - ATC_RAT_RLL_I
  - ATC_RAT_RLL_D
  - ATC_ANG_RLL_P

msg_pid: PIDR

# Confirmacao lida do proprio log: com CC_TYPE=0 nao ha mensagem CC.
espera_cc_tipo: 0

# So os cenarios do bloco L5 do plano da revisao de 3/11: a guinada, o
# ruido de RND 20 e os de robustez que o texto compara em guinada.
cenarios:
- guinada
- ruido/rnd20/torque_impulso
- saturacao
- falha_motor
- erro_modelo
