# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: AC_CustomControl — PID com a alimentacao direta do LQI
slug: cc_pid_ff
descricao: O cc_pid (cascata do nativo, ganhos do AutoTune) com a MESMA alimentacao direta
  pura do LQI, u_ff = (a_t + a*w_t)/b, so da trajetoria do alvo (CC2_FF, firmware/ardupilot.patch).
  Nao se usou o FF/D_FF do AC_PID porque eles multiplicam o alvo de taxa inteiro, inclusive
  a correcao do erro de angulo, e mudariam tambem a realimentacao. Nos ensaios de torque e
  identico ao cc_pid.
params:
  CC_TYPE: 2
  CC_AXIS_MASK: 7
  RC6_OPTION: 109
reboot_apos_params: true

# O backend so assume com a chave auxiliar em HIGH (RC6_OPTION 109);
# o run_ensaio.py forca o canal, e espera_cc_tipo confere no log.
rc_override:
  6: 2000

# Os ganhos do cc_pid.yaml e a alimentacao direta (CC2_FF*), aplicados depois
# do reboot: os CC2_* so existem com o backend instanciado.
ganhos:
  CC2_RAT_RLL_P: 0.08616
  CC2_RAT_RLL_I: 0.08616
  CC2_RAT_RLL_D: 0.000375
  CC2_RAT_PIT_P: 0.08616
  CC2_RAT_PIT_I: 0.08616
  CC2_RAT_PIT_D: 0.000375
  CC2_RAT_YAW_P: 0.607519
  CC2_RAT_YAW_I: 0.060752
  CC2_RAT_YAW_D: 0.0
  CC2_RAT_YAW_FLTE: 1.0
  CC2_ANG_RLL_P: 26.714348
  CC2_ANG_PIT_P: 25.442236
  CC2_ANG_YAW_P: 2.294865
  ATC_ACC_R_MAX: 5856.644531
  ATC_ACC_P_MAX: 5703.29248
  ATC_ACC_Y_MAX: 115.243027
  CC2_FF: 1
  CC2_FF_A: 1.98813
  CC2_FF_B_X: 430.023
  CC2_FF_B_Y: 430.023
  CC2_FF_B_Z: 14.3669
ganhos_de_interesse:
- CC2_FF
- CC2_FF_A
- CC2_FF_B_X
- CC2_FF_B_Z
msg_pid: PIDR
espera_cc_tipo: 2

# So os cenarios do lote original (run_ensaio.voa_no_cenario): este
# controlador e uma verificacao feita para eles.
cenarios:
- rolagem/nominal
- rolagem/torque_pulso
- rolagem/torque_degrau
- rolagem/torque_chirp
- arfagem/nominal
- arfagem/torque_pulso
- arfagem/torque_degrau
- arfagem/torque_chirp
- guinada/nominal
- guinada/torque_pulso
- guinada/torque_degrau
- guinada/torque_chirp
- rolagem_arfagem_guinada/nominal
- rolagem_arfagem_guinada/torque_pulso
- rolagem_arfagem_guinada/torque_degrau
- ruido/rnd20/torque_pulso
- ruido/rnd20/torque_degrau
- vento/rajada
