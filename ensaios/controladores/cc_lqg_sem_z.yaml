# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: AC_CustomControl — LQG de mesmo ruido, ablacao sem z
slug: cc_lqg_sem_z
descricao: O LQG de cc_lqg_mesmo_ruido.yaml sem uma parte do modelo do caminho de medida (sem
  z), reprojetado pela mesma regra (o portao) so em rolagem. Revisao de 3/11, item 2.9 (ablacao).
params:
  CC_TYPE: 4
  CC_AXIS_MASK: 1
  RC6_OPTION: 109
reboot_apos_params: true

# O backend so assume com a chave auxiliar em HIGH (RC6_OPTION 109);
# o run_ensaio.py forca o canal, e espera_cc_tipo confere no log.
rc_override:
  6: 2000

# Ablacao: so o eixo da ablacao roda o backend (CC_AXIS_MASK); os outros ficam
# com o nativo. Os CC4_* sao aplicados depois do reboot.
