# GERADO por modelagem/projeto.py --escrever-yaml a partir do modelo de
# ensaios/resultados/vento/rajada/nativo/2026-10-27_214349 (a = 1.988 1/s, b = 430 / 430 / 14.37 rad/s2,
# BAT.VoltR = 12.44 V). Para mudar os ganhos, mude o projeto e gere de novo.
nome: AC_CustomControl — LQI (filtro10)
slug: cc_lqi_filtro10
descricao: 'Realimentacao de estados com acao integral (LQR discreto sobre [x_I, theta, w])
  e alimentacao direta pela inversao do modelo, no backend AC_CustomControl_LQR com CC3_MODO
  = 0. Mesma frequencia de cruzamento do nativo; o peso do integrador e o mais alto que mantem
  a margem de fase do nativo e amortecimento de 0,7. Variante ''filtro10'': projetado com
  o modelo de 10 Hz no filtro do giroscopio, contra o nativo sintonizado pelo AutoTune nesse
  mesmo veiculo. Na variante, o criterio e o do LQG dela (portao): ruido, MF e MF robusta
  nao piores que as do nativo e o menor pico; a regra da mesma banda do nativo nao tem solucao
  com o filtro mais lento.'
params:
  CC_TYPE: 3
  CC_AXIS_MASK: 7
  RC6_OPTION: 109
  INS_GYRO_FILTER: 10.0
reboot_apos_params: true

# O backend so assume com a chave auxiliar em HIGH (RC6_OPTION 109);
# o run_ensaio.py forca o canal, e espera_cc_tipo confere no log.
rc_override:
  6: 2000

# Os CC3_* so existem com o backend instanciado (CC_TYPE 3 + reboot).
ganhos:
  CC3_MODO: 0
  CC3_FF: 1
  CC3_A: 1.98813
  CC3_FLTW: 10.0
  CC3_B_X: 430.023
  CC3_KI_X: 2.43855
  CC3_KTH_X: 0.604655
  CC3_KW_X: 0.0494161
  CC3_B_Y: 430.023
  CC3_KI_Y: 1.83062
  CC3_KTH_Y: 0.548758
  CC3_KW_Y: 0.0500963
  CC3_B_Z: 14.3669
  CC3_KI_Z: 0.503683
  CC3_KTH_Z: 0.691905
  CC3_KW_Z: 0.206597
  ATC_ACC_R_MAX: 3035.307373
  ATC_ACC_P_MAX: 2892.155273
  ATC_ACC_Y_MAX: 120.858704
ganhos_de_interesse:
- CC3_KI_X
- CC3_KTH_X
- CC3_KW_X
- CC3_KI_Z
msg_pid: PIDR
espera_cc_tipo: 3

# So os cenarios do lote original (run_ensaio.voa_no_cenario): este
# controlador e uma verificacao feita para eles.
cenarios:
- rolagem/nominal
- rolagem/torque_pulso
- rolagem/torque_degrau
- guinada/nominal
- guinada/torque_pulso
- guinada/torque_degrau
- rolagem_arfagem_guinada/torque_estocastico
- ruido/rnd20/torque_pulso
