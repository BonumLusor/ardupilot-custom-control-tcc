# Os pulsos de rolagem/torque_pulso, arfagem/torque_pulso e guinada/torque_pulso
# no MESMO instante.
nome: "Torque impulsivo nos tres eixos — 15, 15 e 3 rad/s2 / 0,3 s"
descricao: >
  Pulso retangular de torque simultaneo em rolagem (15 rad/s2), arfagem
  (15 rad/s2) e guinada (3 rad/s2), por 0,3 s, com a aeronave nivelada e sem
  vento. As amplitudes sao as dos ensaios de um eixo so, entao cada eixo se
  compara direto com o seu par: a diferenca e o efeito de os tres eixos pedirem
  diferencial aos mesmos quatro motores ao mesmo tempo.

  Rolagem e arfagem iguais somam um momento sobre a diagonal do X, que passa
  por M1 e M2: so M3 e M4 tem braco em torno dela, e cada um trabalha o dobro do
  que num pulso de um eixo so. E o carregamento mais severo da mistura entre os
  ensaios de torque.

  O injetor aplica a mesma forma e o mesmo instante aos tres eixos, cada um com
  a sua amplitude (WND_TQX, WND_TQY, WND_TQZ). As metricas de rejeicao saem por
  eixo, todas na mesma janela dos ensaios de um eixo so, e o RMSE fica
  comparavel.

vento:
  WND_MODE: 9        # 1 (vento medio, de intensidade zero) + 8 (pulso de torque)
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 15.0      # rad/s2, o mesmo do rolagem/torque_pulso
  WND_TQY: 15.0      # rad/s2, o mesmo do arfagem/torque_pulso
  WND_TQZ: 3.0       # rad/s2, o mesmo do guinada/torque_pulso
  WND_TQT0: 6
  WND_TQDUR: 0.3
  WND_TQF0: 0.2
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_roll_deg: 0
  degrau_pitch_deg: 0
  degrau_yaw_deg: 0
  t_degrau_s: 0
  duracao_s: 25
