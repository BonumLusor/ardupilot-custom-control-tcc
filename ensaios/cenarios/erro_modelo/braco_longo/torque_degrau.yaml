# Erro de modelo: o veiculo muda, os ganhos ficam os do nominal (todos os
# controladores). A massa do SITL nao serve para isso: a propulsao e refeita a
# partir dela e a inercia escala junto, entao a dinamica angular quase nao muda
# (SIM_Frame.cpp). Esta variante: SIM_FRM_DIAG_SZ 0,42 (padrao 0,35): o braco cresce e a inercia cresce com o
# quadrado, entao b cai 17 % nos tres eixos (358,4 / 11,97 rad/s2); o empuxo de
# pairado nao muda.
# Valores de b de modelagem/modelo_sitl.py com o parm alterado.
nome: "Torque em degrau nos tres eixos, braco longo"
descricao: >
  O rolagem_arfagem_guinada/torque_degrau com o veiculo alterado.

params:
  SIM_FRM_DIAG_SZ: 0.42

vento:
  WND_MODE: 33
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 10.0
  WND_TQY: 10.0
  WND_TQZ: 1.0
  WND_TQT0: 6
  WND_TQDUR: 0.3
  WND_TQF0: 0.2
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_roll_deg: 0
  degrau_pitch_deg: 0
  degrau_yaw_deg: 0
  t_degrau_s: 0
  duracao_s: 60
