# Erro de modelo: o veiculo muda, os ganhos ficam os do nominal (todos os
# controladores). A massa do SITL nao serve para isso: a propulsao e refeita a
# partir dela e a inercia escala junto, entao a dinamica angular quase nao muda
# (SIM_Frame.cpp). Esta variante: SIM_FRM_DIAG_SZ 0,29: b sobe 21 % nos tres eixos (519 / 17,34 rad/s2).
# Valores de b de modelagem/modelo_sitl.py com o parm alterado.
nome: "Torque impulsivo nos tres eixos, braco curto"
descricao: >
  O rolagem_arfagem_guinada/torque_pulso com o veiculo alterado.

params:
  SIM_FRM_DIAG_SZ: 0.29

vento:
  WND_MODE: 513  # 1 (vento medio zero) + 512 (pulso de duracao exata, SIM_TWIST_TIME)
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 15.0
  WND_TQY: 15.0
  WND_TQZ: 3.0
  WND_TQT0: 6
  WND_TQDUR: 0.3
  WND_TQF0: 0.2
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_roll_deg: 0
  degrau_pitch_deg: 0
  degrau_yaw_deg: 0
  t_degrau_s: 0
  duracao_s: 25
