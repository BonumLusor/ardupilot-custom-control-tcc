# Nivel de ruido do giroscopio SIM_GYRn_RND = 10 (pasta ruido/rnd10/): um ponto da
# fronteira rejeicao x ruido medida no SITL. O SITL soma a cada sub-amostra do
# giroscopio um ruido uniforme de amplitude SIM_GYRn_RND (graus/s) vezes o
# acelerador (~0,6 no pairado), e o IMU0 entrega a 1 kHz a media de 8
# sub-amostras: desvio padrao a 1 kHz de ~1.2 graus/s. O angulo do AHRS
# integra o mesmo ruido sem o passa-baixas (modelagem/validacao.py --ruido).
nome: "Torque impulsivo nos tres eixos, ruido de giroscopio 10"
descricao: >
  O rolagem_arfagem_guinada/torque_pulso com ruido no giroscopio: pulso de
  15 rad/s2 em rolagem e arfagem e 3 rad/s2 em guinada, por 0,3 s. O trecho
  calmo antes do pulso mede o esforco que o ruido custa a cada controlador.

params:
  SIM_GYR1_RND: 10
  SIM_GYR2_RND: 10
  SIM_GYR3_RND: 10

vento:
  WND_MODE: 9
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 15.0
  WND_TQY: 15.0
  WND_TQZ: 3.0
  WND_TQT0: 6
  WND_TQDUR: 0.3
  WND_TQF0: 0.2
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_roll_deg: 0
  degrau_pitch_deg: 0
  degrau_yaw_deg: 0
  t_degrau_s: 0
  duracao_s: 25
