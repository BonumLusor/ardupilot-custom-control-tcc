# O impulso curto nos tres eixos, com ruido no giroscopio: e o ensaio que
# mede o que cada controlador paga em sensibilidade a ruido pela banda que
# tem (Cap. 5, ganho de ruido). O resto e identico ao original.
nome: "Impulso curto de torque em tres eixos — 0,70 rad/s em rolagem e em arfagem e 0,83 rad/s em guinada, por 20 ms"
descricao: >
  Pulso retangular de torque de 20 ms, de duracao exata: o injetor escreve a
  amplitude e SIM_TWIST_TIME uma vez, e o SITL desliga o torque ao fim dela.
  Impulso de 0,70 rad/s em rolagem e em arfagem e 0,83 rad/s em guinada, por 20 ms, escolhido no modelo para o desvio do nativo ficar
  abaixo de 1 grau em rolagem e arfagem (o limite linear do controlador de
  raiz quadrada) e o esforco maximo de todos os controladores caber na folga
  da alocacao em guinada (monografia/verificacao/escolher_impulso.txt;
  revisao de 3/11, item 2.6). Mede a recuperacao depois de um choque, sem o
  pico acontecer durante o torque, como no pulso de 0,3 s (o degrau curto).

# Ruido do giroscopio, ligado so neste cenario. O SITL soma a cada sub-amostra
# do giroscopio um ruido uniforme de amplitude SIM_GYRn_RND (graus/s) vezes o
# acelerador — a media dos PWM dos motores, (PWM - 1000)/1000, ~0,6 no
# pairado (AP_InertialSensor_SITL, SITL_State) —, nas tres IMUs que o EKF usa
# (INS_USE, INS_USE2, INS_USE3). Com 20 graus/s, a amplitude no pairado e ~12
# graus/s, a ordem da vibracao de motor que o proprio SITL cita para um
# multirrotor pequeno. O IMU0 entrega a 1 kHz a MEDIA de 8 sub-amostras
# (INS_FAST_SAMPLE), entao o desvio padrao a 1 kHz e ~2,5 graus/s (0,04 rad/s),
# antes do passa-baixas de 20 Hz; e o angulo do AHRS integra esse mesmo ruido
# sem o passa-baixas (conferido em modelagem/validacao.py --ruido). E isso que
# mede o custo da banda de cada controlador no esforco (esforco_* no
# consolidado) e na atitude.
params:
  SIM_GYR1_RND: 20
  SIM_GYR2_RND: 20
  SIM_GYR3_RND: 20

vento:
  WND_MODE: 513        # 1 (vento medio zero) + 512 (pulso de duracao exata, SIM_TWIST_TIME)
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 35.0      # rad/s2, o mesmo do rolagem/torque_impulso
  WND_TQY: 35.0      # rad/s2, o mesmo do arfagem/torque_impulso
  WND_TQZ: 41.5       # rad/s2, o mesmo do guinada/torque_impulso
  WND_TQT0: 6
  WND_TQDUR: 0.02
  WND_TQF0: 0.2
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_roll_deg: 0
  degrau_pitch_deg: 0
  degrau_yaw_deg: 0
  t_degrau_s: 0
  duracao_s: 25
