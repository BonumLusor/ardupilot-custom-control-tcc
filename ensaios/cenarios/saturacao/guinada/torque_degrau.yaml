# Saturacao em guinada. O mixer limita o esforco de guinada a yaw_allowed, a folga
# dos motores (AP_MotorsMatrix.cpp:276-330), ~0,5 no pairado: a autoridade e
# ~0,5 x b_z = ~7 rad/s2. Em rolagem, saturar exigiria ~400 rad/s2. Aqui se
# compara o anti-windup de cada um: a integracao condicional do AC_PID e do
# LQI, e o u aplicado que o ESO e o LQG levam ao estimador.
nome: "Torque em degrau em guinada perto da autoridade — 6 rad/s2"
descricao: >
  Momento constante de 6 rad/s2 em guinada (~85 % da autoridade estimada),
  ligado em t = 6 s e mantido ate o fim: o integrador trabalha perto do limite
  do mixer.

vento:
  WND_MODE: 33
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 0
  WND_TQY: 0
  WND_TQZ: 6.0
  WND_TQT0: 6
  WND_TQDUR: 0.3
  WND_TQF0: 0.2
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_roll_deg: 0
  degrau_pitch_deg: 0
  degrau_yaw_deg: 0
  t_degrau_s: 0
  duracao_s: 60
