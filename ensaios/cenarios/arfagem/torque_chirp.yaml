# Varredura em frequencia de torque em arfagem: a resposta em frequencia de
# rejeicao do eixo y numa corrida, para margem de ganho e de fase.
nome: "Chirp de torque em arfagem — 0,2 a 10 Hz em 20 s"
descricao: >
  Senoide de torque em arfagem com frequencia crescendo exponencialmente de
  0,2 a 10 Hz, com janela de meio cosseno nas pontas — a mesma varredura do
  rolagem/torque_chirp, com a mesma amplitude, porque os dois eixos sao
  simetricos no frame X.

  A analise grava resposta_freq_pitch.png e as metricas em resposta_freq_pitch
  (entrada tqy, saida arfagem).

vento:
  WND_MODE: 65       # 1 (vento medio zero) + 64 (chirp de torque)
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 0
  WND_TQY: 3.0       # rad/s2 — modesto, para ficar na faixa linear
  WND_TQZ: 0
  WND_TQT0: 4        # segundos apos o inicio do perfil
  WND_TQDUR: 20      # duracao da varredura
  WND_TQF0: 0.2      # Hz, inicio
  WND_TQF1: 10.0     # Hz, fim

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_pitch_deg: 0    # nivelado: a varredura e a unica excitacao
  t_degrau_s: 0
  duracao_s: 30
