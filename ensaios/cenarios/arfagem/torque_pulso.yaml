# O rolagem/torque_pulso no eixo de arfagem: perturbacao impulsiva de torque em
# y, em ar parado e com a aeronave nivelada.
nome: "Torque impulsivo em arfagem — pulso 15 rad/s2 / 0,3 s"
descricao: >
  Pulso retangular de torque em arfagem (eixo y do corpo, nariz para cima),
  sem vento. O impulso angular e amplitude x duracao: 15 x 0,3 = 4,5 rad/s.

  Mesma amplitude do pulso de rolagem: no frame X a autoridade de arfagem e a
  de rolagem sao iguais (mesmo braco, mesma inercia), entao os dois ensaios se
  comparam um a um.

vento:
  WND_MODE: 9        # 1 (vento medio, de intensidade zero) + 8 (pulso de torque)
  WND_SPD: 0
  WND_DIR: 0
  WND_DIRZ: 0
  WND_GA: 0
  WND_GT0: 0
  WND_GDUR: 3
  WND_TSIG: 0
  WND_TLU: 200
  WND_SEED: 1
  WND_T0: 8
  WND_TQX: 0
  WND_TQY: 15.0      # rad/s2 — o botao de severidade deste ensaio
  WND_TQZ: 0
  WND_TQT0: 6        # segundos apos o inicio do perfil
  WND_TQDUR: 0.3
  WND_TQF0: 0.2      # so usados pelo chirp (bit 64); aqui ficam nos padroes
  WND_TQF1: 10.0

voo:
  altitude_m: 15
  espera_apos_decolagem_s: 6
  degrau_pitch_deg: 0    # sem degrau: este ensaio mede REJEICAO, nao rastreamento
  t_degrau_s: 0
  duracao_s: 25
